services:
  kohler-assistant:
    build: .
    container_name: kohler-assistant
    ports:
      - "7860:7860"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - AGENT_MODEL=${AGENT_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - SHARE_PROTOTYPE=${SHARE_PROTOTYPE:-false}
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
